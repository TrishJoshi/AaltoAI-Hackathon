<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Poliview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css?v=4" />
    <script type="importmap">
      {
        "imports": {
          "@material/web/": "https://esm.run/@material/web/",
          "lit": "https://esm.run/lit",
          "lit/": "https://esm.run/lit/",
          "@lit/reactive-element": "https://esm.run/@lit/reactive-element",
          "@lit/reactive-element/": "https://esm.run/@lit/reactive-element/",
          "tslib": "https://esm.run/tslib"
        }
      }
    </script>
    <script type="module" src="/static/material.js?v=3"></script>
  </head>
  <body data-role="governance">
    <header class="top-app-bar">
      <a class="brand" href="#/" id="brand-link">
        <span class="brand-mark" aria-hidden="true">Pv</span>
        <span class="brand-text">
          <strong>Poliview</strong>
          <span class="brand-tag">Closed policy. Clear path.</span>
        </span>
      </a>
      <md-tabs id="role-tabs" aria-label="Workspace role">
        <md-primary-tab id="role-governance" inline-icon>
          <md-icon slot="icon">gavel</md-icon>
          Governance
        </md-primary-tab>
        <md-primary-tab id="role-owner" inline-icon>
          <md-icon slot="icon">handshake</md-icon>
          Project owner
        </md-primary-tab>
      </md-tabs>
      <nav class="role-nav" aria-label="Primary">
        <md-text-button href="#/" id="nav-policies">
          <md-icon slot="icon">policy</md-icon>
          Policies
        </md-text-button>
        <md-text-button href="#/project" id="nav-project">
          <md-icon slot="icon">folder_open</md-icon>
          Workspace
        </md-text-button>
        <md-text-button href="#/health" id="nav-health">
          <md-icon slot="icon">monitor_heart</md-icon>
          Health
        </md-text-button>
      </nav>
      <p class="subtitle md-typescale-body-small" id="top-subtitle">Policy library</p>
    </header>
    <md-linear-progress id="global-progress" indeterminate></md-linear-progress>
    <main id="app"></main>
    <md-snackbar id="app-snackbar"></md-snackbar>
    <md-dialog id="delete-dialog">
      <div slot="headline">Delete policy?</div>
      <div slot="content" id="delete-message">This removes the review and its closed JSON.</div>
      <div slot="actions">
        <md-text-button id="delete-cancel">Cancel</md-text-button>
        <md-filled-button id="delete-confirm">Delete</md-filled-button>
      </div>
    </md-dialog>
    <script defer src="/static/app.js?v=5"></script>
    <script defer src="/static/workspace.js?v=5"></script>
  </body>
</html>
